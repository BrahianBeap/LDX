<VirtualHost *:80>
    ProxyPreserveHost On
    # Balanceo Loki
    <proxy balancer://loki>
            BalancerMember http://192.168.0.12:3100/loki/api/v1
    </proxy>
    <Location '/loki/loki/api/v1'>
      ProxyPass balancer://loki
      # NBTECSVAASU18 Norberto Nunez
      Require ip 10.150.60.92
      # Observabilidad
      Require ip 10.11.11.23
    </Location>

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    ErrorLog /error.log
    CustomLog /access.log combined
    # Todo el puerto 80 va a HTTPS por nombre, salvo Loki (2026-10-26)
    RedirectMatch 302 ^/(?!loki/)(.*)$ https://oss.personal.com.py/$1
</VirtualHost>
<VirtualHost *:443>
    # HSTS sumado a CAR en Etapa 2 (2026-11-02). max-age corto al inicio; subir a 31536000 tras unos dias
    Header always set Strict-Transport-Security "max-age=300"
    ServerName oss.personal.com.py
    # Acceso por IP u otro nombre: redirigir al nombre del certificado, solo navegadores (2026-10-26)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^oss\.personal\.com\.py(:443)?$ [NC]
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteCond %{REQUEST_URI} !^/(ntf|loki|supervisionge|jsonrpc\.php|kanboard/jsonrpc\.php)
    RewriteRule ^/(.*)$ https://oss.personal.com.py/$1 [R=302,L]

    SSLEngine on
    SSLStrictSNIVHostCheck on
    SSLCipherSuite HIGH:!aNULL:!MD5:!RC4
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile      /etc/ssl/certs/oss.personal.com.py-20261022.fullchain.pem
    SSLCertificateKeyFile   /etc/ssl/private/oss.personal.com.py-20261022.key

    SSLVerifyClient optional
    SSLVerifyDepth 1
    SSLCACertificateFile    /etc/ssl/certs/ca.crt

    ProxyPreserveHost On
    # Balanceo NTF
    <proxy balancer://NTF>
            BalancerMember http://FDO-WS-1:8000/api/1/ntf/send hcmethod=GET hcinterval=1 hcpasses=2 hcfails=3
            BalancerMember http://PFR-WS-1:8000/api/1/ntf/send hcmethod=GET hcinterval=1 hcpasses=2 hcfails=3
    </proxy>
    # Navegadores sin certificado de cliente: raiz y resto en 'none'; solo /ntf exige cert
    <Location "/">
      SSLVerifyClient none
    </Location>
    # VulnApp NG (DEC-042)
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /vulnapp http://192.168.0.14:5000/vulnapp
    ProxyPassReverse /vulnapp http://192.168.0.14:5000/vulnapp
    # Bloquear web.config de Kanboard (Nessus 121479, 16/10/2026)
    ProxyPass /web.config !
    <Location "/web.config">
      Require all denied
    </Location>
    # Kanboard en /kanboard/ hacia Franco (192.168.0.106); la raiz queda para el portal
    RedirectMatch ^/(kanboard|kamboard)$ /kanboard/
    RedirectMatch ^/kamboard/(.*)$ /kanboard/$1
    ProxyPass /kanboard/web.config !
    <Location "/kanboard/web.config">
      Require all denied
    </Location>
    ProxyPass        /kanboard/ http://192.168.0.106/kanboard/
    ProxyPassReverse /kanboard/ http://192.168.0.106/kanboard/
    # Compatibilidad con enlaces viejos de Kanboard (correos, Telegram, favoritos) y la API anterior
    RewriteCond %{QUERY_STRING} (^|&)controller=
    RewriteRule ^/(index\.php)?$ /kanboard/ [R=302,L]
    ProxyPass /jsonrpc.php http://192.168.0.106/kanboard/jsonrpc.php
    # ADM-TECH entorno de desarrollo hacia Franco (DEV-ADMTECH-APP 192.168.0.19), acceso abierto (2026-11-02)
    RedirectMatch ^/adm$ /adm/
    ProxyPass /adm/ http://192.168.0.19/adm/
    ProxyPassReverse /adm/ http://192.168.0.19/adm/
    ProxyPass /adm !
    # ACL para NTF
    <Location '/ntf'>
      SSLVerifyClient require
      ProxyPass balancer://NTF
      # NBTECSVAASU18 Norberto Nunez
      Require ip 10.150.60.92
      # Tembiapo
      Require ip 10.11.11.24
    </Location>

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    ErrorLog /error.log
    CustomLog /access.log combined
</VirtualHost>
